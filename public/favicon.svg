<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Gift box body -->
  <rect x="6" y="28" width="52" height="32" rx="4" fill="url(#grad)"/>
  <!-- Horizontal ribbon -->
  <rect x="6" y="40" width="52" height="8" fill="white" opacity="0.3"/>
  <!-- Vertical ribbon -->
  <rect x="26" y="28" width="12" height="32" fill="white" opacity="0.3"/>
  <!-- Lid -->
  <rect x="4" y="20" width="56" height="12" rx="3" fill="url(#grad)"/>
  <!-- Lid ribbon -->
  <rect x="26" y="20" width="12" height="12" fill="white" opacity="0.3"/>
  <!-- Bow left -->
  <ellipse cx="24" cy="14" rx="10" ry="8" fill="url(#grad)"/>
  <ellipse cx="24" cy="14" rx="6" ry="5" fill="white" opacity="0.2"/>
  <!-- Bow right -->
  <ellipse cx="40" cy="14" rx="10" ry="8" fill="url(#grad)"/>
  <ellipse cx="40" cy="14" rx="6" ry="5" fill="white" opacity="0.2"/>
  <!-- Bow center -->
  <circle cx="32" cy="16" r="5" fill="url(#grad)"/>
</svg>
