services:
  laterbase:
    build: .
    image: laterbase-selfhosted:local
    container_name: laterbase
    ports:
      - "8080:8080"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@laterbase.local}
      # Set ADMIN_PASSWORD only on first run if you want to choose the first password.
      # It must be at least 15 characters.
      # If left empty, Laterbase generates a password and prints it in the logs.
      # - ADMIN_PASSWORD=change-me-now-123
      # If you serve the app behind HTTPS, enable Secure cookies.
      # - LATERBASE_SECURE_COOKIES=true
    volumes:
      - laterbase_data:/data
    restart: unless-stopped

volumes:
  laterbase_data:
