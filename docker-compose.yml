services:
  wishlist:
    build: .
    image: wishlist-selfhosted:local
    container_name: wishlist
    ports:
      - "8080:8080"
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@wishlist.local}
      # Set ADMIN_PASSWORD only on first run if you want to choose the first password.
      # It must be at least 12 characters.
      # If left empty, Wishlist generates a password and prints it in the logs.
      # - ADMIN_PASSWORD=change-me-now-123
      # If you serve the app behind HTTPS, enable Secure cookies.
      # - WISHLIST_SECURE_COOKIES=true
    volumes:
      - wishlist_data:/data
    restart: unless-stopped

volumes:
  wishlist_data:
