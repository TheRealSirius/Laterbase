name: Bug report
description: Report something that is broken in Laterbase
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include passwords, session cookies, backup files, or private Laterbase data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to reproduce the issue.
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Docker Compose
        - Docker run
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0 or commit hash"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker version, reverse proxy if any.
      placeholder: "Windows 11, Docker Desktop, Chrome, localhost:8080"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs only after removing secrets.
      render: text
